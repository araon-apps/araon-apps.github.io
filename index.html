<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아라온 (Araon)</title>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --link:#0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --link:#4493f8; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      font-size:17px; line-height:1.7; word-break:keep-all; overflow-wrap:break-word; }
    main { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
    h1 { font-size:26px; line-height:1.3; margin:0 0 8px; }
    h2 { font-size:21px; margin:48px 0 12px; padding-top:16px; border-top:1px solid var(--line); }
    h3 { font-size:17px; margin:28px 0 4px; }
    p, ul { margin:0 0 12px; }
    ul { padding-left:22px; }
    a { color:var(--link); }
    .muted { color:var(--muted); font-size:15px; }
    nav a { margin-right:12px; }
  </style>
</head>
<body>
  <main>
    <h1>아라온 (Araon)</h1>
    <p class="muted">앱 안내 · Apps</p>

    <h2>클립포아 (Clipoa)</h2>
    <p>공유로 링크를 저장하고 분류 · 메모하는 앱. 유튜브는 저장한 시점부터 재생.<br>
      <span class="muted">Save links by sharing, sort them into folders and add notes. YouTube videos play from the moment you saved.</span></p>
    <p><a href="clipoa/privacy/">개인정보처리방침 · Privacy Policy</a></p>

    <h2>문의 · Contact</h2>
    <p><a href="mailto:araon.apps@gmail.com">araon.apps@gmail.com</a></p>
  </main>
</body>
</html>
